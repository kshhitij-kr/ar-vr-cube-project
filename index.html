<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multi-Target WebAR (Secure Production)</title>

    <!-- Privacy & Referrer Protections -->
    <meta name="referrer" content="no-referrer">

    <!-- 1. Strict Content Security Policy (CSP) for WebAR Camera -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://aframe.io https://cdn.jsdelivr.net;
        worker-src 'self' blob: https://cdn.jsdelivr.net;
        style-src 'self' 'unsafe-inline';
        style-src-elem 'self' 'unsafe-inline';
        style-src-attr 'self' 'unsafe-inline';
        img-src 'self' data: blob: mediastream:;
        connect-src 'self' blob: https://cdn.jsdelivr.net https://aframe.io;
        font-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    ">

    <!-- 2. Secure Dependencies -->
    <script 
        src="https://aframe.io/releases/1.5.0/aframe.min.js" 
        crossorigin="anonymous">
    </script>
    <script 
        src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js" 
        crossorigin="anonymous">
    </script>

    <style>
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #FFFFFF;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #start-btn {
            padding: 16px 36px;
            font-size: 18px;
            font-weight: 600;
            background-color: #FF5722;
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(255, 87, 34, 0.4);
        }

        #start-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #start-btn:active:not(:disabled) {
            transform: scale(0.97);
            background-color: #E64A19;
        }
    </style>

    <script>
      // Anti-Clickjacking Guard
      if (window.top !== window.self) {
        try {
          window.top.location = window.self.location;
        } catch (e) {
          console.warn("Framing restricted by Security Policy.");
        }
      }

      // Privacy: Stop camera tracks when page/tab is inactive
      function stopCameraTracks() {
        const videos = document.querySelectorAll('video');
        videos.forEach(video => {
          if (video && video.srcObject) {
            const stream = video.srcObject;
            const tracks = stream.getTracks();
            tracks.forEach(track => track.stop());
            video.srcObject = null;
          }
        });
      }

      window.addEventListener('pagehide', stopCameraTracks);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          stopCameraTracks();
        }
      });

      // Interactive Color Changer Component (Target 0)
      AFRAME.registerComponent('color-changer', {
        init: function () {
          const colors = ['#2196F3', '#FF5722', '#4CAF50', '#9C27B0', '#FFEB3B'];
          let colorIndex = 0;
          
          this.el.addEventListener('click', () => {
            colorIndex = (colorIndex + 1) % colors.length;
            this.el.setAttribute('color', colors[colorIndex]);
          });
        }
      });

      // Handle AR Overlay Launch
      function startAR() {
        const startBtn = document.getElementById('start-btn');
        if (startBtn) startBtn.disabled = true;

        const overlay = document.getElementById('overlay');
        if (overlay) {
          overlay.style.display = 'none';
        }
      }

      // Prevent WebGL Context Loss Crashes on Mobile
      document.addEventListener('DOMContentLoaded', () => {
        const scene = document.querySelector('a-scene');
        if (scene) {
          scene.addEventListener('render-target-loaded', () => {
            const canvas = scene.canvas;
            if (canvas) {
              canvas.addEventListener('webglcontextlost', (event) => {
                event.preventDefault();
                console.warn("WebGL Context Lost. Safe recovery initialized.");
              }, false);
            }
          });
        }
      });
    </script>
</head>

<body>

    <!-- User Permission Gesture Overlay -->
    <div id="overlay">
        <h2>WebAR Multi-Target Experience</h2>
        <p>Tap below to enable camera permissions</p>
        <button id="start-btn" onclick="startAR()">Start AR</button>
    </div>

    <a-scene
        mindar-image="imageTargetSrc: ./targets.mind;"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights: true, antialias: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!-- Camera Setup -->
        <a-camera
            position="0 0 0"
            look-controls="enabled: false"
            cursor="fuse: false; rayOrigin: mouse"
            raycaster="far: 1000; objects: .clickable">
        </a-camera>

        <!-- TARGET 0: BLUE CUBE (Rotating, Tap-to-Change-Color) -->
        <a-entity mindar-image-target="targetIndex: 0">
            <a-box
                class="clickable"
                color-changer
                position="0 0 0.3"
                scale="0.5 0.5 0.5"
                color="#2196F3"
                animation="property: rotation; to: 360 360 360; loop: true; dur: 5000; easing: linear">
            </a-box>
        </a-entity>

        <!-- TARGET 1: MULTI-COLOR SPHERE (Bouncing & Color-Shifting) -->
        <a-entity mindar-image-target="targetIndex: 1">
            <a-sphere
                position="0 0 0.3"
                radius="0.4"
                color="#FF5722"
                animation__bounce="property: position; to: 0 0 0.6; dir: alternate; loop: true; dur: 1500; easing: easeInOutSine"
                animation__color="property: material.color; to: #00E676; dir: alternate; loop: true; dur: 2000">
            </a-sphere>
        </a-entity>

    </a-scene>

</body>

</html>
